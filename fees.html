<!DOCTYPE html>
<html>
<head>
<title>Fees Details</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(to right,#667eea,#764ba2);
    color:white;
    text-align:center;
}

.container{
    margin-top:30px;
}

/* Select Box */
select{
    padding:10px;
    margin:10px;
    border-radius:6px;
    border:none;
}

/* Button */
button{
    padding:10px 20px;
    background:#4facfe;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#3b8edc;
}

/* Table */
.table-box{
    margin-top:20px;
    width:80%;
    margin-left:auto;
    margin-right:auto;
    background:white;
    color:black;
    border-radius:10px;
    padding:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
}

th{
    background:#4facfe;
    color:white;
}

.note{
    color:green;
    font-weight:bold;
}
</style>

</head>

<body>

<h2>💰 Smart Fees System</h2>

<div class="container">

<!-- Dropdowns -->
<select id="caste">
<option value="">Select Caste</option>
<option value="general">General</option>
<option value="obc">OBC</option>
<option value="sc">SC</option>
<option value="st">ST</option>
<option value="nt">NT</option>
<option value="vjnt">VJNT</option>
<option value="ews">EWS</option>
</select>

<select id="gender">
<option value="">Select Gender</option>
<option value="boy">Boy</option>
<option value="girl">Girl</option>
</select>

<br>

<button onclick="calculateFees()">Show Fees</button>

<div id="output" class="table-box">
👉 Select caste & gender to view fees
</div>

<br>
<button onclick="goBack()">⬅ Back</button>

</div>

<script>

// 🔐 Correct session check
var loginData = JSON.parse(sessionStorage.getItem("loginData"));
if(!loginData){
    alert("⚠️ Please login first!");
    window.location.href="login.html";
}

function calculateFees(){

let caste = document.getElementById("caste").value;
let gender = document.getElementById("gender").value;

if(caste==="" || gender===""){
    alert("Please select caste and gender");
    return;
}

let data = "";

/* GENERAL */
if(caste==="general" && gender==="boy"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition Fees</td><td>₹60,000</td></tr>
<tr><td>Exam Fees</td><td>₹5,000</td></tr>
<tr><td>Library Fees</td><td>₹3,000</td></tr>
<tr><td>Hostel Fees</td><td>₹10,000</td></tr>
<tr><th>Total</th><th>₹78,000</th></tr>
</table>`;
}

else if(caste==="general" && gender==="girl"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition Fees</td><td>₹40,000 (Discount)</td></tr>
<tr><td>Exam Fees</td><td>₹5,000</td></tr>
<tr><td>Library Fees</td><td>₹3,000</td></tr>
<tr><td>Hostel Fees</td><td>FREE</td></tr>
<tr><th>Total</th><th>₹48,000</th></tr>
<tr><td colspan="2" class="note">🎉 Girl Student Benefit Applied</td></tr>
</table>`;
}

/* OBC */
else if(caste==="obc" && gender==="boy"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition</td><td>₹35,000</td></tr>
<tr><td>Other Charges</td><td>₹10,000</td></tr>
<tr><th>Total</th><th>₹45,000</th></tr>
</table>`;
}

else if(caste==="obc" && gender==="girl"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition</td><td>₹20,000</td></tr>
<tr><td>Hostel</td><td>FREE</td></tr>
<tr><th>Total</th><th>₹30,000</th></tr>
<tr><td colspan="2" class="note">🎉 Scholarship Applied</td></tr>
</table>`;
}

/* SC / ST */
else if((caste==="sc" || caste==="st") && gender==="girl"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition</td><td>₹0</td></tr>
<tr><td>Hostel</td><td>FREE</td></tr>
<tr><td>Exam Fees</td><td>₹5,000</td></tr>
<tr><th>Total</th><th>₹5,000</th></tr>
<tr><td colspan="2" class="note">🎉 Full Government Support</td></tr>
</table>`;
}

else if((caste==="sc" || caste==="st") && gender==="boy"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Exam Fees</td><td>₹5,000</td></tr>
<tr><td>Other Charges</td><td>₹5,000</td></tr>
<tr><th>Total</th><th>₹10,000</th></tr>
</table>`;
}

/* NT / VJNT / EWS */
else if(gender==="girl"){
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Tuition</td><td>Discount Applied</td></tr>
<tr><td>Hostel</td><td>FREE</td></tr>
<tr><th>Total</th><th>₹20,000</th></tr>
<tr><td colspan="2" class="note">🎉 Special Girl Benefit</td></tr>
</table>`;
}

else{
data = `
<table>
<tr><th>Type</th><th>Amount</th></tr>
<tr><td>Total Fees</td><td>₹30,000</td></tr>
</table>`;
}

document.getElementById("output").innerHTML = data;
}

function goBack(){
window.location.href="dashboard.html";
}

</script>

</body>
</html>
